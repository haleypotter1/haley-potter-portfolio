name: Daily Health Dashboard Email

on:
  schedule:
    # Fires at both 16:00 and 17:00 UTC — the two UTC hours that map to noon
    # Eastern across DST. The script itself checks the local hour and
    # no-ops on whichever firing isn't actually noon that day.
    - cron: '0 16,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run daily Garmin dashboard report
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/run_daily_report.py

      - name: Commit updated history
        run: |
          git config user.name "garmin-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/garmin_history.json
          git diff --staged --quiet || git commit -m "Update Garmin health history"
          git push
